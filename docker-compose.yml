version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: novacare_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: 
      context: ./medilink_backend
      dockerfile: Dockerfile
    container_name: novacare_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medilink
      - JWT_SECRET=your_super_secret_jwt_key_here
      - FRONTEND_URL=http://localhost:80
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./medilink_frontend
      dockerfile: Dockerfile
    container_name: novacare_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
